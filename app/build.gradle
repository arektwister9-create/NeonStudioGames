plugins { id 'com.android.application' }

android {
    namespace 'pl.neonempire.game'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.neonempire.game'
        minSdk 24
        targetSdk 36
        versionCode 13
        versionName '0.9.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('NEON_KEYSTORE_PATH')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('NEON_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEON_KEY_ALIAS')
                keyPassword System.getenv('NEON_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (System.getenv('NEON_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}
