name: Build NEON EMPIRE Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate JavaScript
        run: node --check app/src/main/assets/game.js
      - name: Prepare upload keystore (optional)
        env:
          NEON_KEYSTORE_BASE64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NEON_KEYSTORE_BASE64" ]; then
            echo "$NEON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neon-upload.jks"
            echo "NEON_KEYSTORE_PATH=$RUNNER_TEMP/neon-upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK and AAB
        env:
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-empire-0.7.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: neon-empire-0.7.0-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
