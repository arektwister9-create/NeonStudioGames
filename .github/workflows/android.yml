name: Build NEON EMPIRE Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate JavaScript
        run: |
          npm ci --no-audit --no-fund
          npm run build:runtime
          git diff --exit-code -- app/src/main/assets/compat
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          node tests/economy.test.cjs
          node tests/audio.test.cjs
          node tests/campaign.test.cjs
          node tests/expedition.test.cjs
          node tests/compat.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser regression tests
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Prepare upload keystore (optional)
        env:
          NEON_KEYSTORE_BASE64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NEON_KEYSTORE_BASE64" ]; then
            echo "$NEON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neon-upload.jks"
            echo "NEON_KEYSTORE_PATH=$RUNNER_TEMP/neon-upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK and AAB
        env:
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Verify installable APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/neon-badging.txt
          grep -q "name='pl.neonempire.game.debug' versionCode='13' versionName='0.9.2'" /tmp/neon-badging.txt
          unzip -t "$APK"
          while IFS= read -r -d '' file; do unzip -p "$APK" "${file#app/src/main/}" | cmp - "$file"; done < <(find app/src/main/assets -type f -print0)
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash scripts/check-install.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-empire-0.9.2-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: neon-empire-0.9.2-development-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
