name: Build signed Google Play bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Require upload signing key
        env:
          NEON_KEYSTORE_BASE64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        run: |
          for variable in NEON_KEYSTORE_BASE64 NEON_KEYSTORE_PASSWORD NEON_KEY_ALIAS NEON_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then echo "Missing Actions secret: $variable"; exit 1; fi
          done
          printf '%s' "$NEON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neon-upload.p12"
          chmod 600 "$RUNNER_TEMP/neon-upload.p12"
          echo "NEON_KEYSTORE_PATH=$RUNNER_TEMP/neon-upload.p12" >> "$GITHUB_ENV"
      - name: Install SDK and run regression tests
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          for file in tests/*.test.cjs; do node "$file"; done
      - name: Build signed release
        env:
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease lintRelease
      - name: Validate Google Play AAB
        run: |
          curl -fL --retry 2 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          python3 scripts/verify-play-bundle.py app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/bundletool.jar"
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/SHA256SUMS
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install production release on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/check-install.sh app/build/outputs/apk/release/app-release.apk pl.neonempire.game
      - name: Upload Google Play package
        uses: actions/upload-artifact@v4
        with:
          name: neon-empire-google-play-signed
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/SHA256SUMS
          if-no-files-found: error
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/neon-upload.p12"
